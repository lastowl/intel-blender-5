name: Build Blender (Intel macOS)

# Builds x86_64 Blender against a prebuilt dependency stack published as a
# GitHub release.
#
# Why the dependency stack is not built here: it needs roughly 7-8 hours on
# GitHub's 4-core Intel runner, against a hard 6-hour per-job ceiling. Run 7 of
# this workflow reached ispc at 335 minutes with OSL, OpenImageIO, USD, OpenVDB
# and MaterialX still outstanding. So the stack is built once on real Intel
# hardware (scripts/build-deps-x64.sh) and published with package-deps.sh and
# publish-deps.sh; this workflow consumes it.
#
# That split is cheap to live with because the stack is keyed on a hash of
# Blender's versions.cmake, not on a Blender version. Mainline releases that do
# not change dependency versions reuse the same stack, so the usual cost of a
# new Blender release is just the build below.
#
# NOTE ON RUNNER LIFETIME: macos-15-intel is the last x86_64 macOS image GitHub
# will offer, available until August 2027. macos-13 was retired in December
# 2025. After the sunset this needs a self-hosted Intel runner.

on:
  workflow_dispatch:
    inputs:
      blender_tag:
        description: "Blender tag or branch to build"
        required: true
        default: "v5.2.0"

jobs:
  blender:
    name: Blender
    runs-on: macos-15-intel
    timeout-minutes: 300
    env:
      BLENDER_TAG: ${{ inputs.blender_tag }}
      BLENDER_SRC: ${{ github.workspace }}/blender
      DEPS_INSTALL_DIR: ${{ github.workspace }}/lib-x64-deps
      LIBDIR: ${{ github.workspace }}/lib-x64-deps
      BUILD_DIR: ${{ github.workspace }}/build-x64
      # fetch-deps.sh uses the gh CLI to find and download the release.
      GH_TOKEN: ${{ github.token }}
      # Signing inputs live at job level, not step level, because a step's own
      # `env:` block is not visible to that step's `if:` expression. All of
      # these are empty in a fork or an unconfigured repo, which is what makes
      # the signing steps below skip themselves rather than fail.
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_P8_B64: ${{ secrets.APPLE_API_KEY_P8 }}
      # Repository variables, not secrets: visible, overridable, and neutral
      # when unset so nobody inherits a publisher's identity.
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
      BUNDLE_VENDOR: ${{ vars.BUNDLE_VENDOR }}
    steps:
      - uses: actions/checkout@v4

      - name: Clone Blender
        run: |
          git clone --depth=1 --branch "$BLENDER_TAG" \
            https://projects.blender.org/blender/blender.git blender
          # Explicit rather than relying on the smudge filter: without the LFS
          # assets, configure fails with "Detected incomplete startup blend".
          git -C blender lfs pull

      - name: Apply Intel patch series
        run: ./scripts/apply-patches.sh

      # Fails loudly if Blender's dependency versions changed and no matching
      # stack has been published, rather than building against a stale one.
      - name: Fetch dependency stack
        run: ./scripts/fetch-deps.sh

      - name: Install build tools
        run: brew install ninja

      - name: Build Blender
        run: ./scripts/build-blender-x64.sh

      # Runs unconditionally, signed or not. An unofficial build should never
      # claim org.blenderfoundation.blender, and BUNDLE_VENDOR is left empty
      # unless a publisher sets it, so forks inherit nobody's identity.
      - name: Set unofficial bundle identity
        env:
          APP: ${{ github.workspace }}/build-x64/bin/Blender.app
        run: ./scripts/brand-app.sh

      # Everything below degrades to a no-op without secrets. A fork, or this
      # repo before any certificate is configured, still produces a working
      # unsigned .dmg -- no Apple account required to rebuild.
      - name: Import signing certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          # Without this, codesign blocks on a UI prompt that never appears.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Sign Blender.app
        env:
          APP: ${{ github.workspace }}/build-x64/bin/Blender.app
        run: ./scripts/sign-app.sh

      - name: Package .dmg
        env:
          APP: ${{ github.workspace }}/build-x64/bin/Blender.app
          OUT_DIR: ${{ github.workspace }}
        run: ./scripts/package-dmg.sh

      - name: Notarize and staple
        run: |
          if [[ -n "$APPLE_API_KEY_P8_B64" ]]; then
            echo "$APPLE_API_KEY_P8_B64" | base64 --decode > "$RUNNER_TEMP/ascapi.p8"
            export APPLE_API_KEY_P8="$RUNNER_TEMP/ascapi.p8"
          fi
          ./scripts/notarize-dmg.sh
          rm -f "$RUNNER_TEMP/ascapi.p8"

      # Runs even if a step above failed, so a certificate is never left
      # sitting in a keychain on the runner.
      - name: Remove signing keychain
        if: always() && env.KEYCHAIN != ''
        run: |
          security list-keychains -d user -s login.keychain-db
          security delete-keychain "$KEYCHAIN" || true

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: blender-intel-macos
          path: "*.dmg"
          if-no-files-found: error
